<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام الفواتير والمبيعات - PWA</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #3498db;
            --border-color: #bdc3c7;
            --bg-color: #f8f9fa;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        .header-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--primary-color);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
        }
        .form-group label {
            font-weight: 600;
            margin-bottom: 5px;
            font-size: 14px;
        }
        .form-group input, .form-group select, .form-group textarea {
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 14px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }
        th, td {
            border: 1px solid #7f8c8d;
            padding: 8px;
            text-align: center;
            font-size: 13px;
        }
        th {
            background-color: #ecf0f1;
            color: #2c3e50;
        }
        input.table-input {
            width: 90%;
            padding: 5px;
            border: 1px solid #ddd;
            text-align: center;
        }
        .totals-box {
            width: 350px;
            margin-left: auto;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 15px;
            background: #fff;
        }
        .totals-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 14px;
        }
        .totals-row.grand-total {
            font-weight: bold;
            font-size: 16px;
            border-top: 1px solid #000;
            padding-top: 8px;
        }
        .actions {
            margin-top: 20px;
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }
        button {
            padding: 10px 20px;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 15px;
        }
        button:hover {
            background-color: #2980b9;
        }
        button.print-btn {
            background-color: #27ae60;
        }
        button.print-btn:hover {
            background-color: #219653;
        }

        /* تنسيق الطباعة ليكون مطابقاً للـ PDF تماماً */
        @media print {
            body {
                background: white;
                padding: 0;
            }
            .container {
                box-shadow: none;
                padding: 0;
                width: 100%;
            }
            .no-print {
                display: none !important;
            }
            table {
                border-color: #000 !important;
            }
            th, td {
                border-color: #000 !important;
                color: #000 !important;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-section">
        <div>
            <h2>فاتورة مبيعات / مستند</h2>
            <p id="invoice-number-display">رقم الفاتورة: جاري التحميل...</p>
        </div>
        <div>
            <p>التاريخ: <span id="current-date"></span></p>
        </div>
    </div>

    <!-- معلومات العميل والمندوب -->
    <div class="form-grid">
        <div class="form-group">
            <label>نوع المستند</label>
            <select id="docType">
                <option value="فاتورة مبيعات">فاتورة مبيعات</option>
                <option value="عرض سعر">عرض سعر</option>
                <option value="مرتجع">مرتجع</option>
            </select>
        </div>
        <div class="form-group">
            <label>اسم العميل *</label>
            <input type="text" id="clientName" list="clientsList" placeholder="اكتب أو اختر اسم العميل">
            <datalist id="clientsList"></datalist>
        </div>
        <div class="form-group">
            <label>رقم الهاتف / المحمول</label>
            <input type="text" id="clientPhone" placeholder="رقم الهاتف">
        </div>
        <div class="form-group">
            <label>مسؤول المبيعات (المندوب) *</label>
            <select id="salesPerson">
                <option value="">اختر المندوب</option>
            </select>
        </div>
    </div>

    <!-- جدول الأصناف -->
    <table>
        <thead>
            <tr>
                <th style="width: 5%;">م</th>
                <th style="width: 25%;">المنتج / الصنف</th>
                <th style="width: 15%;">النوع</th>
                <th style="width: 10%;">الكمية</th>
                <th style="width: 12%;">سعر الوحدة</th>
                <th style="width: 10%;">خصم %</th>
                <th style="width: 13%;">الإجمالي</th>
                <th style="width: 10%;" class="no-print">ملاحظات</th>
            </tr>
        </thead>
        <tbody id="itemsTableBody">
            <!-- صف افتراضي أول -->
            <tr>
                <td>1</td>
                <td>
                    <input type="text" class="table-input product-search" list="productsList" placeholder="ابحث عن صنف...">
                    <datalist id="productsList"></datalist>
                </td>
                <td>
                    <select class="table-input product-type">
                        <option value="لوح/متر">لوح/متر</option>
                        <option value="قطعة">قطعة</option>
                        <option value="خدمة">خدمة</option>
                    </select>
                </td>
                <td><input type="number" class="table-input qty" value="1" min="1" oninput="calculateTotals()"></td>
                <td><input type="number" class="table-input price" value="0" oninput="calculateTotals()"></td>
                <td><input type="text" class="table-input discount" placeholder="0%" value="0"></td>
                <td class="row-total">0.00</td>
                <td class="no-print"><input type="text" class="table-input notes" value="بيع / حجز"></td>
            </tr>
        </tbody>
    </table>

    <div class="no-print" style="margin-bottom: 20px;">
        <button type="button" onclick="addRow()">+ إضافة صنف جديد</button>
    </div>

    <!-- الإجماليات -->
    <div class="totals-box">
        <div class="totals-row">
            <span>الإجمالي قبل الخصم:</span>
            <span id="subTotal">0.00 ج.م</span>
        </div>
        <div class="totals-row">
            <span>خصم إضافي / خاص:</span>
            <input type="number" id="extraDiscount" value="0" style="width: 80px; text-align: center;" oninput="calculateTotals()">
        </div>
        <div class="totals-row grand-total">
            <span>صافي إجمالي الفاتورة:</span>
            <span id="grandTotal">0.00 ج.م</span>
        </div>
    </div>

    <!-- أزرار الإجراءات والطباعة -->
    <div class="actions no-print">
        <button class="print-btn" onclick="saveAndPrintInvoice()">حفظ وطباعة الفاتورة</button>
    </div>
</div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwldbeWh_RtinV4vtmx7x98bUbdy1ZqQ1MjMUFz1p_rLjuuYMkTSV6jecuE2mFtwpxu/exec";

    // تعيين التاريخ ورقم الفاتورة التلقائي
    document.getElementById('current-date').innerText = new Date().toLocaleDateString('ar-EG');
    document.getElementById('invoice-number-display').innerText = 'رقم الفاتورة: INV-' + Math.floor(100000 + Math.random() * 900000);

    // جلب البيانات من Google Sheets عند فتح التطبيق
    window.addEventListener('DOMContentLoaded', () => {
        fetchDataFromCloud();
        registerServiceWorker();
    });

    function fetchDataFromCloud() {
        if (!navigator.onLine) {
            console.log("أنت تعمل في وضع الأوفلاين حالياً.");
            return;
        }

        fetch(SCRIPT_URL)
            .then(res => res.json())
            .then(data => {
                // تعبئة المنتجات والعملاء والموظفين إن وجدوا في الرد
                if (data && data.salesPersons) {
                    let spSelect = document.getElementById('salesPerson');
                    spSelect.innerHTML = '<option value="">اختر المندوب</option>';
                    data.salesPersons.forEach(sp => {
                        spSelect.innerHTML += `<option value="${sp}">${sp}</option>`;
                    });
                }
            })
            .catch(err => console.log("خطأ في جلب البيانات:", err));
    }

    function addRow() {
        const tbody = document.getElementById('itemsTableBody');
        const rowCount = tbody.rows.length + 1;
        const row = tbody.insertRow();
        row.innerHTML = `
            <td>${rowCount}</td>
            <td><input type="text" class="table-input product-search" list="productsList" placeholder="ابحث عن صنف..."></td>
            <td>
                <select class="table-input product-type">
                    <option value="لوح/متر">لوح/متر</option>
                    <option value="قطعة">قطعة</option>
                    <option value="خدمة">خدمة</option>
                </select>
            </td>
            <td><input type="number" class="table-input qty" value="1" min="1" oninput="calculateTotals()"></td>
            <td><input type="number" class="table-input price" value="0" oninput="calculateTotals()"></td>
            <td><input type="text" class="table-input discount" placeholder="0%" value="0"></td>
            <td class="row-total">0.00</td>
            <td class="no-print"><input type="text" class="table-input notes" value="بيع / حجز"></td>
        `;
    }

    function calculateTotals() {
        let subTotal = 0;
        const rows = document.querySelectorAll('#itemsTableBody tr');
        
        rows.forEach(row => {
            const qty = parseFloat(row.querySelector('.qty').value) || 0;
            const price = parseFloat(row.querySelector('.price').value) || 0;
            const rowTotal = qty * price;
            row.querySelector('.row-total').innerText = rowTotal.toFixed(2);
            subTotal += rowTotal;
        });

        document.getElementById('subTotal').innerText = subTotal.toFixed(2) + ' ج.م';
        const extraDisc = parseFloat(document.getElementById('extraDiscount').value) || 0;
        const netTotal = subTotal - extraDisc;
        document.getElementById('grandTotal').innerText = netTotal.toFixed(2) + ' ج.م';
    }

    function saveAndPrintInvoice() {
        const clientName = document.getElementById('clientName').value;
        const salesPerson = document.getElementById('salesPerson').value;

        if (!clientName || !salesPerson) {
            alert('الرجاء إدخال اسم العميل واختيار مسؤول المبيعات قبل الحفظ والطباعة!');
            return;
        }

        window.print();
    }

    // تسجيل الخدمة العاملة للـ PWA محلياً
    function registerServiceWorker() {
        if ('serviceWorker' in navigator) {
            const swCode = `
                self.addEventListener('install', e => e.waitUntil(self.skipWaiting()));
                self.addEventListener('activate', e => e.waitUntil(self.clients.claim()));
                self.addEventListener('fetch', e => e.respondWith(fetch(e.request).catch(() => caches.match(e.request))));
            `;
            const blob = new Blob([swCode], {type: 'application/javascript'});
            const swUrl = URL.createObjectURL(blob);
            navigator.serviceWorker.register(swUrl).catch(err => console.log('SW registration failed', err));
        }
    }
</script>

</body>
</html>
